<!DOCTYPE html>
<html>
<head>
    <title>Crop Yield Prediction</title>
    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
            text-align:center;
        }

        .container{
            width:400px;
            margin:auto;
            margin-top:40px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:8px;
        }

        button{
            padding:10px 20px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        h2{
            color:green;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Crop Yield Prediction</h2>

<form action="/predict" method="post">

<input type="text" name="feature1" placeholder="Feature 1" required>

<input type="text" name="feature2" placeholder="Feature 2" required>

<input type="text" name="feature3" placeholder="Feature 3" required>

<input type="text" name="feature4" placeholder="Feature 4" required>

<input type="text" name="feature5" placeholder="Feature 5" required>

<button type="submit">Predict</button>

</form>

<h3>{{ prediction_text }}</h3>

</div>

</body>
</html>
